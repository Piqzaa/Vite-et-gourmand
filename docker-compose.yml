services:
  db:
    image: mysql:8.0
    container_name: vg_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: vite_et_gourmand
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./DataBase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./DataBase/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - vg_db_data:/var/lib/mysql

  mongo:
    image: mongo:latest
    container_name: vg_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - vg_mongo_data:/data/db

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: vg_php
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: vite_et_gourmand
      DB_USER: root
      DB_PASS: root
      MONGODB_URI: "mongodb://mongo:27017"
      BASE_URL: ""
      DB_CHARSET: utf8mb4
    depends_on:
      - db
      - mongo

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vg_pma
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  vg_db_data:
  vg_mongo_data:
